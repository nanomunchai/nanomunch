<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — NanoMunch</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
  body{font-family:'DM Sans',sans-serif;background:#1A1A2E;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:2rem;text-align:center;flex-direction:column}
  .logo-mark{width:56px;height:56px;background:#C9A84C0D;border:1.5px solid rgba(201,168,76,.3);border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:1.5rem}
  .logo-mark svg{width:34px;height:34px}
  h1{font-family:'Syne',sans-serif;font-size:clamp(2.5rem,8vw,5rem);color:#C9A84C;margin-bottom:.5rem}
  p{font-size:1.1rem;color:rgba(255,255,255,.7);max-width:500px;line-height:1.7;margin-bottom:2rem}
  .btn{background:#C9A84C;color:#1A1A2E;padding:.8rem 2rem;border-radius:8px;font-weight:700;text-decoration:none;font-size:1rem;transition:all .2s;display:inline-flex;align-items:center;gap:.5rem}
  .btn:hover{background:#9C7A2E;transform:translateY(-2px)}
  .note{font-size:.85rem;color:rgba(255,255,255,.35);margin-top:2rem}
  .note a{color:#C9A84C;text-decoration:underline}
</style>
</head>
<body>
<div class="logo-mark"><svg viewBox="0 0 18 18" fill="none"><path d="M3 15V3l5 8 5-8v12" stroke="#C9A84C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<h1>404</h1>
<p>Oops! The page you're looking for doesn't exist or has been moved.</p>
<a href="https://nanomunchai.github.io/nanomunch/" class="btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1A1A2E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg> Return to NanoMunch Home</a>
<p class="note">You'll be redirected automatically in <span id="countdown">5</span> seconds.</p>
<script>
  let seconds = 5;
  const el = document.getElementById('countdown');
  const interval = setInterval(() => {
    seconds--;
    el.textContent = seconds;
    if (seconds <= 0) {
      clearInterval(interval);
      window.location.href = 'https://nanomunchai.github.io/nanomunch/';
    }
  }, 1000);
</script>
</body>
</html>
